  - name: win11-secure
    annotation: "Windows 11 desktop, Secure Boot + vTPM (Windows 11 baseline); data disk is a dynamic simple volume"
    guest_id: windows11_64Guest
    os_label: "Windows 11 23H2 (64-bit)"
    cpus: 4
    cores_per_socket: 2
    memory_mb: 8192
    hardware_version: vmx-20
    firmware: efi
    secure_boot: true
    tpm: true
    folder: lab-windows
    resource_pool: lab-general
    power_state: random
    cbt: random
    fast_boot: random
    tools_status: random
    cpu_hot_add: true
    memory_hot_add: true
    disks:
      - { size_gb: 100, controller: nvme, datastore: LocalDS_0, thin: true }
      - { size_gb: 100, controller: nvme, datastore: LocalDS_1, thin: true, disk_type: dynamic }
    volumes:
      - { name: Data, kind: simple, disks: [2] }
    nics:
      - { network: prod, type: vmxnet3 }
    cdrom: { backing: client }
    boot_order: [disk, cdrom]

