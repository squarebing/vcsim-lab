# vcsim lab inventory — declarative VM matrix.
#
# This file is the single source of truth for the lab. Edit it, then run:
#   python scripts/build_lab.py
# to (re)build the lab, and:
#   python scripts/verify_lab.py
# to check the live inventory still matches it.
#
# Design notes:
# - `guest_id` must be a valid vSphere guest OS identifier. The builder warns
#   on IDs outside the known-good list in vcsim_lab/config.py, but vcsim itself
#   accepts any string. Run `python scripts/query_lab.py --guest-ids` to list
#   the IDs the simulator advertises.
# - `firmware: efi` is required for TPM and for GPU passthrough / vGPU.
# - `boot_order` uses symbolic tokens, resolved to real device keys after the
#   VM is created: disk, disk:2, network, network:2, cdrom, floppy.
# - GPU `mode: passthrough` binds a real host PCI device if a display-class
#   device is found on a cluster host, and falls back to `dynamic`
#   (DynamicBackingInfo, vCenter picks a matching device at power-on) when the
#   simulator has no GPU to bind. `vgpu` attaches an NVIDIA vGPU profile.
# - Disks: `thin: true` = thin provisioned, `thin: false` + `eager: true` =
#   thick eager-zeroed, `thin: false` + `eager: false` = thick lazy-zeroed.
# - `datastore` names must exist in the vcsim inventory (default compose file
#   creates LocalDS_0..2). The builder lists available datastores on error.

lab:
  datacenter: DC0
  cluster: DC0_C0
  # VM folders created under the datacenter's vm folder.
  folders:
    - lab-windows
    - lab-linux
    - lab-gpu
  # Resource pools created under the cluster's root resource pool.
  resource_pools:
    - lab-general
    - lab-gpu

# Logical network names -> inventory objects. `type` selects the backing:
#   standard = Network (vim.vm.device.VirtualEthernetCard.NetworkBackingInfo)
#   dvpg     = DistributedVirtualPortgroup
#   opaque   = OpaqueNetwork (NSX). If the inventory has no opaque network
#              (vcsim started without -nsx), NICs on it fall back to
#              `vm-network` and the build report records the substitution.
networks:
  vm-network:
    name: "VM Network"
    type: standard
  prod:
    name: DC0_DVPG0
    type: dvpg
  backup:
    name: DC0_DVPG1
    type: dvpg
  nsx-overlay:
    name: DC0_NSX0
    type: opaque
    fallback: vm-network

vms:
  # ---- Windows ---------------------------------------------------------
  - name: win11-secure
    annotation: "Windows 11 desktop, Secure Boot + vTPM (Windows 11 baseline)"
    guest_id: windows11_64Guest
    os_label: "Windows 11 23H2 (64-bit)"
    cpus: 4
    cores_per_socket: 2
    memory_mb: 8192
    hardware_version: vmx-20
    firmware: efi
    secure_boot: true
    tpm: true
    folder: lab-windows
    resource_pool: lab-general
    power_on: true
    cpu_hot_add: true
    memory_hot_add: true
    disks:
      - { size_gb: 100, controller: nvme, datastore: LocalDS_0, thin: true }
    nics:
      - { network: prod, type: vmxnet3 }
    cdrom: { backing: client }
    boot_order: [disk, cdrom]

  - name: win2022-sql
    annotation: "Windows Server 2022, SQL host: OS + eager-zeroed data disk, dual NIC"
    guest_id: windows2019srvNext_64Guest
    os_label: "Windows Server 2022 (64-bit)"
    cpus: 8
    cores_per_socket: 4
    memory_mb: 16384
    hardware_version: vmx-20
    firmware: efi
    secure_boot: false
    tpm: true
    folder: lab-windows
    resource_pool: lab-general
    power_on: true
    disks:
      - { size_gb: 100, controller: pvscsi, datastore: LocalDS_0, thin: true }
      - { size_gb: 500, controller: pvscsi, datastore: LocalDS_1, thin: false, eager: true }
    nics:
      - { network: prod, type: vmxnet3 }
      - { network: backup, type: vmxnet3 }
    cdrom: null
    boot_order: [disk]

  - name: win10-vdi
    annotation: "Windows 10 VDI desktop with 3D video (no PCI GPU)"
    guest_id: windows9_64Guest
    os_label: "Windows 10 (64-bit)"
    cpus: 4
    cores_per_socket: 2
    memory_mb: 8192
    hardware_version: vmx-20
    firmware: efi
    secure_boot: true
    tpm: true
    video_3d: true
    video_ram_kb: 131072
    folder: lab-windows
    resource_pool: lab-general
    power_on: true
    disks:
      - { size_gb: 80, controller: nvme, datastore: LocalDS_0, thin: true }
    nics:
      - { network: prod, type: vmxnet3 }
    cdrom: null
    boot_order: [disk]

  # ---- GPU -------------------------------------------------------------
  - name: ubuntu-gpu-llm
    annotation: "Ubuntu LLM inference node, PCI passthrough GPU (T4 class)"
    guest_id: ubuntu64Guest
    os_label: "Ubuntu Linux 24.04 (64-bit)"
    cpus: 8
    cores_per_socket: 4
    memory_mb: 32768
    hardware_version: vmx-20
    firmware: efi
    secure_boot: false
    tpm: false
    gpu:
      mode: passthrough
      vendor_id: "0x10de"   # NVIDIA
      device_id: "0x1eb8"   # Tesla T4 (used for the dynamic fallback)
      label: "Tesla T4"
      mmio_size_gb: 32
    folder: lab-gpu
    resource_pool: lab-gpu
    power_on: false
    disks:
      - { size_gb: 200, controller: nvme, datastore: LocalDS_0, thin: true }
    nics:
      - { network: prod, type: vmxnet3 }
    cdrom: null
    boot_order: [disk]

  - name: ubuntu-vgpu-vdi
    annotation: "Ubuntu VDI node, NVIDIA vGPU profile (shared GPU, no passthrough)"
    guest_id: ubuntu64Guest
    os_label: "Ubuntu Linux 24.04 (64-bit)"
    cpus: 4
    cores_per_socket: 2
    memory_mb: 16384
    hardware_version: vmx-20
    firmware: efi
    secure_boot: false
    tpm: false
    gpu:
      mode: vgpu
      profile: nvidia_a100-40c
      label: "vGPU A100-40C"
    folder: lab-gpu
    resource_pool: lab-gpu
    power_on: false
    disks:
      - { size_gb: 100, controller: nvme, datastore: LocalDS_0, thin: true }
    nics:
      - { network: prod, type: vmxnet3 }
    cdrom: null
    boot_order: [disk]

  - name: rhel9-ai-train
    annotation: "RHEL 9 AI training node, dynamic GPU + vTPM + Secure Boot, dual NIC"
    guest_id: rhel9_64Guest
    os_label: "Red Hat Enterprise Linux 9 (64-bit)"
    cpus: 16
    cores_per_socket: 8
    memory_mb: 65536
    hardware_version: vmx-20
    firmware: efi
    secure_boot: true
    tpm: true
    gpu:
      mode: dynamic
      vendor_id: "0x10de"   # NVIDIA
      device_id: "0x20b0"   # A100 PCIe
      label: "A100 PCIe"
      mmio_size_gb: 128
    folder: lab-gpu
    resource_pool: lab-gpu
    power_on: false
    disks:
      - { size_gb: 500, controller: nvme, datastore: LocalDS_1, thin: true }
    nics:
      - { network: prod, type: vmxnet3 }
      - { network: nsx-overlay, type: vmxnet3 }
    cdrom: null
    boot_order: [disk]

