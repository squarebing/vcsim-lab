# vcsim lab inventory — declarative VM matrix.
#
# This file is the single source of truth for the lab. Edit it, then run:
#   python scripts/build_lab.py
# to (re)build the lab, and:
#   python scripts/verify_lab.py
# to check the live inventory still matches it.
#
# Design notes:
# - `guest_id` must be a valid vSphere guest OS identifier. The builder warns
#   on IDs outside the known-good list in vcsim_lab/config.py, but vcsim itself
#   accepts any string. Run `python scripts/query_lab.py --guest-ids` to list
#   the IDs the simulator advertises.
# - `firmware: efi` is required for TPM and for GPU passthrough / vGPU.
# - `boot_order` uses symbolic tokens, resolved to real device keys after the
#   VM is created: disk, disk:2, network, network:2, cdrom, floppy.
# - GPU `mode: passthrough` binds a real host PCI device if a display-class
#   device is found on a cluster host, and falls back to `dynamic`
#   (DynamicBackingInfo, vCenter picks a matching device at power-on) when the
#   simulator has no GPU to bind. `vgpu` attaches an NVIDIA vGPU profile.
#   GPUs carry `vendor` (nvidia | amd) and `model` (e.g. A100, MI210);
#   vendor/model are cross-checked against the PCI vendor:device IDs.
#   `vgpu` is NVIDIA-only: AMD MxGPU is SR-IOV virtual functions presented
#   as PCI passthrough devices, so an AMD shared-GPU VM uses `dynamic` or
#   `passthrough` with AMD PCI IDs instead of a vGPU profile.
# - `template: true` marks the VM as a vSphere template (MarkAsTemplate) as
#   the last build step, after all device extras — device reconfigs on a
#   template are rejected. Templates cannot be powered on and are exempt
#   from power-state assignment (they always stay poweredOff).
# - Per-VM attributes, each an explicit value or `random` (resolved from
#   `lab.random_seed`, so the same seed always gives the same assignment):
#     cbt:          true | false | random  — Changed Block Tracking
#                   (changeTrackingEnabled, in the create spec).
#     power_state:  poweredOn | poweredOff | suspended | random —
#                   enforced after create (suspend = power on, then
#                   SuspendVM_Task). Omit to derive from `power_on:`.
#     fast_boot:    true | false | random  — boot delay 0 ms (boot
#                   immediately) vs. the standard 3000 ms. There is no
#                   native vSphere VM "fast boot" setting; bootDelay is
#                   the lab's representation of it (see README).
#     tools_status: toolsNotInstalled | toolsNotRunning | toolsOk |
#                   toolsOld | random — the DECLARED VMware Tools status.
#                   Tools status is guest-reported with no setter API
#                   and vcsim always reports toolsNotInstalled, so this
#                   is compared declared-vs-live, never enforced.
# - `vapp_config:` sets OVF product info + environment properties on an
#   appliance VM (vAppConfig, served back intact by vcsim). `vapp_container:`
#   places the VM inside one of the vApp containers in `lab.vapps`.
# - Disks: `thin: true` = thin provisioned, `thin: false` + `eager: true` =
#   thick eager-zeroed, `thin: false` + `eager: false` = thick lazy-zeroed.
# - `disk_type: basic | dynamic` is the Windows Disk Management
#   distinction (dynamic disks are Windows-only). vSphere has no API
#   property for it, so it is declared in the model and stamped into
#   the VM's extraConfig (`lab.diskLayout`) so it is visible in the
#   inventory; `volumes:` groups dynamic disks into named volumes
#   (simple / spanned / striped / mirrored), with disk indexes 1-based
#   like the boot tokens (disk:2 = second disk).
# - `datastore` names must exist in the vcsim inventory (default compose file
#   creates LocalDS_0..2). The builder lists available datastores on error.

lab:
  datacenter: DC0
  cluster: DC0_C0
  # Seed for the per-VM random attributes (cbt, power_state,
  # fast_boot, tools_status). Same seed -> same assignment.
  random_seed: 42
  # VM folders created under the datacenter's vm folder.
  folders:
    - lab-windows
    - lab-linux
    - lab-gpu
    - lab-templates
    - lab-appliances
  # Resource pools created under the cluster's root resource pool.
  resource_pools:
    - lab-general
    - lab-gpu
  # vApp containers created under the cluster's root resource pool
  # (ResourcePool.CreateVApp). VMs name one via `vapp_container:`.
  vapps:
    - lab-appliances

# Logical network names -> inventory objects. `type` selects the backing:
#   standard = Network (vim.vm.device.VirtualEthernetCard.NetworkBackingInfo)
#   dvpg     = DistributedVirtualPortgroup
#   opaque   = OpaqueNetwork (NSX). If the inventory has no opaque network
#              (vcsim started without -nsx), NICs on it fall back to
#              `vm-network` and the build report records the substitution.
networks:
  vm-network:
    name: "VM Network"
    type: standard
  prod:
    name: DC0_DVPG0
    type: dvpg
  backup:
    name: DC0_DVPG1
    type: dvpg
  nsx-overlay:
    name: DC0_NSX0
    type: opaque
    fallback: vm-network

