  # ---- Appliances ------------------------------------------------------
  - name: opnsense-fw
    annotation: "OPNsense firewall appliance (FreeBSD), WAN + LAN NICs, OVF properties"
    guest_id: freebsd13_64Guest
    os_label: "FreeBSD 13 (64-bit)"
    cpus: 2
    cores_per_socket: 1
    memory_mb: 4096
    hardware_version: vmx-19
    firmware: bios
    secure_boot: false
    tpm: false
    folder: lab-appliances
    vapp_container: lab-appliances
    power_state: poweredOn
    cbt: false
    fast_boot: random
    tools_status: random
    disks:
      - { size_gb: 40, controller: lsi-sas, datastore: LocalDS_2, thin: true }
    nics:
      - { network: vm-network, type: e1000 }   # WAN
      - { network: prod, type: vmxnet3 }       # LAN
    cdrom: null
    boot_order: [disk]
    vapp_config:
      name: OPNsense
      vendor: Deciso
      version: "24.7"
      full_version: "24.7.1"
      properties:
        - { id: hostname, label: "Hostname", type: string, value: opnsense-fw }
        - { id: wan_ip, label: "WAN IP address", type: ip, value: "192.168.1.1" }
        - { id: lan_ip, label: "LAN IP address", type: ip, value: "10.0.0.1" }
        - { id: admin_password, label: "Admin password", type: password, value: changeme }

  - name: truenas-storage
    annotation: "TrueNAS storage appliance (FreeBSD), BIOS, OS + data disk, OVF properties"
    guest_id: freebsd13_64Guest
    os_label: "FreeBSD 13 (64-bit)"
    cpus: 4
    cores_per_socket: 2
    memory_mb: 8192
    hardware_version: vmx-20
    firmware: bios
    secure_boot: false
    tpm: false
    folder: lab-appliances
    vapp_container: lab-appliances
    power_state: poweredOn
    cbt: true
    fast_boot: random
    tools_status: random
    disks:
      - { size_gb: 40, controller: nvme, datastore: LocalDS_0, thin: true }
      - { size_gb: 200, controller: nvme, datastore: LocalDS_1, thin: true }
    nics:
      - { network: prod, type: vmxnet3 }
    cdrom: null
    boot_order: [disk]
    vapp_config:
      name: TrueNAS
      vendor: iXsystems
      version: "24.10"
      full_version: "24.10.2"
      properties:
        - { id: hostname, label: "Hostname", type: string, value: truenas-storage }
        - { id: mgmt_ip, label: "Management IP address", type: ip, value: "10.0.0.10" }
        - { id: admin_password, label: "Admin password", type: password, value: changeme }
