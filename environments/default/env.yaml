# Environment: default — the full lab.
#
# This is the original vcsim-lab environment: 22 VMs spanning Windows,
# Linux and BSD, BIOS and EFI, GPU passthrough / vGPU / dynamic, TPM,
# Secure Boot, templates, appliances, randomized attributes and
# basic/dynamic disks (see vms.yaml in this directory).
#
# env.yaml describes ONE vCenter simulation: the vcsim port it listens
# on and the inventory shape vcsim generates (datacenters, clusters,
# hosts, datastores, ...). Credentials are NOT here — they come from
# the VCSIM_USERNAME / VCSIM_PASSWORD environment variables, shared
# across all environments.
#
# To add an environment, copy environments/dev (the small template),
# pick a new name and an unused port, and edit its vms.yaml.
# See README "Multiple environments".

name: default
description: "The full 22-VM lab: Windows/Linux/BSD, GPU, TPM, templates, appliances"
port: 8989

# vcsim inventory flags (see `vcsim -help`). All optional — omitted
# keys default to the values below, which match the original lab.
vcsim:
  api_version: "8.0.3"
  datacenters: 1
  clusters: 1
  hosts: 3
  standalone_hosts: 1
  datastores: 3
  pods: 1
  portgroups: 2
  nsx: 1
  pools: 1
