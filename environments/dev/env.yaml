# Environment: dev — a small 3-VM environment.
#
# This is the template for new environments: copy this directory,
# rename it, pick an unused port, and edit vms.yaml. It is deliberately
# small (3 VMs, 2 cluster hosts, 2 datastores) so it starts fast and
# costs little on Render, where every environment in environments/
# starts at container boot (see VCSIM_ENVS in docker-entrypoint.sh).
#
# env.yaml describes ONE vCenter simulation: the vcsim port it listens
# on and the inventory shape vcsim generates. Credentials come from
# VCSIM_USERNAME / VCSIM_PASSWORD (shared across environments).

name: dev
description: "Small 3-VM dev environment (template for new environments)"
port: 8990

# Smaller inventory than `default`: 2 cluster hosts instead of 3,
# 2 datastores instead of 3. Everything else keeps the defaults.
vcsim:
  api_version: "8.0.3"
  datacenters: 1
  clusters: 1
  hosts: 2
  standalone_hosts: 1
  datastores: 2
  pods: 1
  portgroups: 2
  nsx: 1
  pools: 1
